spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/users, /users/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/products, /products/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/orders, /orders/**